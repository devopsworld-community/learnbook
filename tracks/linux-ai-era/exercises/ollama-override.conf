# I AM NOT DONE
# /etc/systemd/system/ollama.service.d/override.conf
# This host also runs kind and the agent. Ollama must be reachable from this machine only, be throttled
# before it is killed, and keep its hands off the rest of the filesystem while still reaching the GPU.
[Service]
Environment=OLLAMA_HOST=0.0.0.0:11434
Environment=OLLAMA_MODELS=/var/lib/ollama/models
MemoryMax=48G
MemoryHigh=52G

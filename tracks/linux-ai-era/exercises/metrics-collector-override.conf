# I AM NOT DONE
# /etc/systemd/system/metrics-collector.service.d/override.conf
# The vendor unit sets MemoryMax=64M and MemoryHigh=48M. The collector holds ~180 MB of buffers at steady
# state, so cgroup v2 OOM-kills it on every start. Someone "fixed" it by removing the limits entirely.
[Service]
MemoryMax=infinity
MemoryHigh=infinity

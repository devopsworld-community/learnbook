#!/usr/sbin/nft -f
# /etc/sysconfig/nftables.conf on an inference host. SSH (22) and the app (8080) must be reachable,
# Ollama (11434) must only be reachable from the host itself, and the default-drop policy must stay.
flush ruleset
table inet filter {
  chain input {
    type filter hook input priority 0; policy drop;
    ct state established,related accept
    iif lo accept
    tcp dport 22 accept
    tcp dport 8080 accept
    icmp type echo-request accept
  }
  chain forward { type filter hook forward priority 0; policy drop; }
  chain output  { type filter hook output  priority 0; policy accept; }
}

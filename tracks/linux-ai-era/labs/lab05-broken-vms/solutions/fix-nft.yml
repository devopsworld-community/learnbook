# Oracle fix for the AL2023 nftables VM. Fixes persisted file FIRST, validates, then reloads.
- hosts: all
  become: true
  tasks:
    - name: Fix SSH port typo in persisted ruleset
      replace: { path: /etc/sysconfig/nftables.conf, regexp: 'tcp dport 2 accept', replace: 'tcp dport 22 accept' }
    - name: Accept the app port instead of dropping it
      replace: { path: /etc/sysconfig/nftables.conf, regexp: 'tcp dport 8080 drop', replace: 'tcp dport 8080 accept' }
    - name: Validate ruleset syntax before touching the live firewall
      command: nft -c -f /etc/sysconfig/nftables.conf
      changed_when: false
    - name: Apply atomically (nft -f replaces the ruleset in one transaction)
      command: nft -f /etc/sysconfig/nftables.conf
    - name: Prove SSH still works from the control host
      wait_for: { port: 22, host: "{{ ansible_host | default(inventory_hostname) }}", timeout: 10 }
      delegate_to: localhost
      become: false
